[project]
name = "rvc-trainer"
description = "在 ComfyUI 内训练 RVC（Retrieval-based Voice Conversion）音色模型。导出*.pth、*.npy和*.index。"
version = "1.0.2"
requires-python = ">=3.9"
license = { text = "MIT License" }
dependencies = [
    "librosa",
    "scipy",
    "soundfile"
]

[project.urls]
Repository = "https://github.com/mailzwj/ComfyUI-RVC-Trainer"

optional-dependencies = [
    "faiss-cpu",
    "scikit-learn",
]
inference = [
    "faiss-cpu",
]

[tool.comfy]
PublisherId = "meet-ai"
DisplayName = "ComfyUI-RVC-Trainer"
Icon = ""